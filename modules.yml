# -- controllers --

  - name: hwdata
    config-opts:
      - --datarootdir=/app/share
    sources:
      - type: git
        url: https://github.com/vcrhonek/hwdata
        tag: v0.406
        commit: 9ae3b9da5cbb93eed30f812aa7edb4b9ad3e3868
        x-checker-data:
